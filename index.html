<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İstanbulkart Dolum Noktaları</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    /* Geri Dön Butonu */
    .back-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: #000;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #333;
    }
  </style>
</head>

<body>

<!-- Geri Dön Butonu -->
<a 
  href="https://batuhangorgu.wordpress.com/2025/12/27/istanbul-kart-dolum-noktasi/" 
  class="back-btn">
  ⬅ Geri Dön
</a>

<!-- Harita -->
<div id="map"></div>

<script>
  // İstanbul merkez
  var map = L.map('map').setView([41.0082, 28.9784], 11);

  // Harita katmanı
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // İstanbulkart dolum noktaları (örnek noktalar)
  var dolumNoktalari = [
    { isim: "Eminönü İstanbulkart Dolum", lat: 41.0165, lng: 28.9707 },
    { isim: "Kadıköy İstanbulkart Dolum", lat: 40.9910, lng: 29.0287 },
    { isim: "Üsküdar İstanbulkart Dolum", lat: 41.0236, lng: 29.0154 },
    { isim: "Beşiktaş İstanbulkart Dolum", lat: 41.0430, lng: 29.0044 },
    { isim: "Bakırköy İstanbulkart Dolum", lat: 40.9760, lng: 28.8726 }
  ];

  // Marker ekleme + Google Maps yönlendirme
  dolumNoktalari.forEach(function(n) {

    var mapsLink =
      "https://www.google.com/maps/dir/?api=1&destination=" +
      n.lat + "," + n.lng;

    L.marker([n.lat, n.lng])
      .addTo(map)
      .bindPopup(
        "<b>" + n.isim + "</b><br><br>" +
        "<a href='" + mapsLink + "' target='_blank'>📍 Konuma Git</a>"
      );
  });
</script>

</body>
</html>
